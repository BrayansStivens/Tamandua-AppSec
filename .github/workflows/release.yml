# Published images for self-hosting, on every version tag (v0.9, v0.9.1…):
#
#   ghcr.io/<owner>/tamandua:<version>              panel, API and worker (docker/app/Dockerfile)
#   ghcr.io/<owner>/tamandua-worker:<version>       worker with the engines inside, no Docker socket (target worker-standalone)
#   ghcr.io/<owner>/tamandua-opengrep:<engine>      SAST engine (docker/engines/opengrep/Dockerfile)
#
# linux/amd64 and linux/arm64, with an SBOM and SLSA provenance attached by BuildKit, and signed with cosign keyless
# (GitHub OIDC: no key to store or leak). Verify with `make verify-images` or the command in docs/deploy-vps.md.
#
# The tag must match tamandua/version.py (v0.9 or v0.9.<patch>): the compose files of that checkout ask for that tag.
# A patch tag also moves the <major.minor> tag, which is the one compose pulls.
# Actions pinned by commit; no cache (a release is built from scratch); only this job can write packages.
# First release only: GHCR creates both packages as private; make them public (package settings → visibility) so
# servers can pull them without credentials.
name: Release images

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build, push and sign (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>
      id-token: write   # cosign keyless: the workflow's OIDC identity signs
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: tamandua
            context: .
            file: docker/app/Dockerfile
          - image: tamandua-worker
            context: .
            file: docker/app/Dockerfile
            target: worker-standalone
          - image: tamandua-opengrep
            context: docker/engines/opengrep
            file: docker/engines/opengrep/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Name and tags
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}  # never interpolated directly into the script
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tamandua/version.py)"
          if ! printf '%s' "$REF_NAME" | grep -Eq "^v${version//./\\.}(\.[0-9]+)?$"; then
            echo "::error::Tag $REF_NAME does not match tamandua/version.py ($version): use v$version or v$version.<patch>."
            exit 1
          fi
          name="ghcr.io/${OWNER,,}/$IMAGE"
          if [ "$IMAGE" = tamandua ] || [ "$IMAGE" = tamandua-worker ]; then
            tags="$name:$version"
            [ "$REF_NAME" != "v$version" ] && tags="$tags,$name:${REF_NAME#v}"
            build_args="VERSION=${REF_NAME#v}"
          else
            engine="$(sed -n 's/^ARG OPENGREP_VERSION=//p' docker/engines/opengrep/Dockerfile)"
            tags="$name:$engine"
            build_args=""
          fi
          {
            echo "name=$name"
            echo "tags=$tags"
            echo "build_args=$build_args"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.meta.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          pull: true
          push: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign (keyless) and check the signature
        env:
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # By digest, never by tag: the signature covers exactly what was pushed (the index and its platforms).
          cosign sign --yes --recursive "$NAME@$DIGEST"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" "$NAME@$DIGEST" > /dev/null
          echo "### $NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
