# Pide la firma del CLA (CLA.md) en los pull requests y la registra en la rama `cla-signatures`
# (signatures/v1/cla.json). Sustituye a contributor-assistant/github-action, archivada en marzo de 2026:
# el script es nuestro y solo usa actions/github-script, mantenida por GitHub y fijada por commit.
#
# Por qué pull_request_target es seguro aquí: el workflow no descarga ni ejecuta el código del PR
# (no hay checkout ni `run:`), y el script no interpola nada del evento en una orden: lee el PR por
# la API, compara el comentario con la frase exacta y escribe en una rama propia.
name: CLA

on:  # zizmor: ignore[dangerous-triggers] sin checkout ni ejecución del código del PR (ver arriba)
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # registrar la firma en la rama cla-signatures
      pull-requests: write   # leer los commits del PR y comentar
      statuses: write        # estado «CLA» en el último commit
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'He leído el CLA de Tamandua y lo acepto'))
    steps:
      - name: Comprobar y registrar firmas
        # v9.0.0, fijada por commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const PHRASE = 'He leído el CLA de Tamandua y lo acepto'
            const BRANCH = 'cla-signatures'
            const FILE = 'signatures/v1/cla.json'
            const MARKER = '<!-- tamandua-cla -->'
            const DOCUMENT = 'https://github.com/BrayansStivens/appsec-agent/blob/main/CLA.md'
            const ALLOWLIST = new Set(['BrayansStivens'])
            const { owner, repo } = context.repo
            const number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number

            async function load() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH })
                const parsed = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'))
                return { sha: data.sha, list: Array.isArray(parsed.signedContributors) ? parsed.signedContributors : [] }
              } catch (error) {
                if (error.status === 404) return { sha: undefined, list: [] }
                throw error
              }
            }

            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: BRANCH })
              } catch (error) {
                if (error.status !== 404) throw error
                const { data: repository } = await github.rest.repos.get({ owner, repo })
                const { data: head } = await github.rest.git.getRef({ owner, repo, ref: `heads/${repository.default_branch}` })
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: head.object.sha })
              }
            }

            // Autores de los commits del PR con cuenta de GitHub; los bots y la lista de permitidos no firman.
            async function authors() {
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 })
              const people = new Map()
              const unknown = new Set()
              for (const commit of commits) {
                const who = commit.author
                if (who && who.id) {
                  if (who.type !== 'Bot' && !ALLOWLIST.has(who.login)) people.set(who.id, who.login)
                } else {
                  unknown.add((commit.commit.author && commit.commit.author.name) || 'sin nombre')
                }
              }
              return { people, unknown }
            }

            async function sign(commenter) {
              for (let attempt = 0; attempt < 3; attempt++) {
                await ensureBranch()
                const { sha, list } = await load()
                if (list.some(entry => entry.id === commenter.id)) return
                list.push({ name: commenter.login, id: commenter.id, comment_id: context.payload.comment.id,
                            created_at: context.payload.comment.created_at, repoId: context.payload.repository.id,
                            pullRequestNo: number })
                const content = Buffer.from(JSON.stringify({ signedContributors: list }, null, 2) + '\n').toString('base64')
                try {
                  await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: FILE, branch: BRANCH, sha, content,
                    message: `CLA firmado por ${commenter.login} en #${number}` })
                  return
                } catch (error) {
                  // Otra firma entró a la vez: se relee y se reintenta.
                  if ((error.status !== 409 && error.status !== 422) || attempt === 2) throw error
                }
              }
            }

            async function report(pending, unknown, sha) {
              const ok = pending.length === 0 && unknown.size === 0
              await github.rest.repos.createCommitStatus({ owner, repo, sha, context: 'CLA', state: ok ? 'success' : 'failure',
                description: ok ? 'Todas las personas del PR han firmado el CLA' : 'Falta firmar el CLA' })
              const body = ok
                ? `${MARKER}\nTodas las personas que contribuyen en este PR han firmado el CLA. ¡Gracias!`
                : [MARKER,
                   `¡Gracias por tu contribución! Antes de poder aceptarla necesitamos que leas y aceptes el [Acuerdo de Licencia de Contribución](${DOCUMENT}). ` +
                   'Conservas los derechos de autor de tu código; el acuerdo nos da una licencia para distribuirlo también en una posible edición comercial, ' +
                   'y garantiza que seguirá disponible en la edición libre.',
                   '', 'Para firmarlo, comenta exactamente esta frase (solo hace falta una vez):', '', '```', PHRASE, '```',
                   ...(pending.length ? ['', `Falta la firma de: ${pending.map(login => '@' + login).join(', ')}.`] : []),
                   ...(unknown.size ? ['', `Hay commits sin cuenta de GitHub asociada (${[...unknown].join(', ')}): configura en git el email ` +
                                       'de tu cuenta, reescribe esos commits y vuelve a subirlos.'] : [])].join('\n')
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 })
              const previous = comments.find(comment => comment.user && comment.user.type === 'Bot' && (comment.body || '').startsWith(MARKER))
              if (previous) {
                if (previous.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
              } else if (!ok) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body })
              }
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            const { people, unknown } = await authors()
            if (context.eventName === 'issue_comment' && context.payload.comment.body.trim() === PHRASE) {
              const commenter = context.payload.comment.user
              // Solo firma quien es autor de algún commit del PR: nadie firma por otra persona.
              if (people.has(commenter.id)) await sign(commenter)
            }
            const { list } = await load()
            const signed = new Set(list.map(entry => entry.id))
            const pending = [...people].filter(([id]) => !signed.has(id)).map(([, login]) => login)
            await report(pending, unknown, pull.head.sha)
