# Asks for the CLA signature (.github/CLA.md) on pull requests and records it in the `cla-signatures` branch
# (signatures/v1/cla.json). Replaces contributor-assistant/github-action, archived in March 2026:
# the script is ours and only uses actions/github-script, maintained by GitHub and pinned by commit.
#
# Why pull_request_target is safe here: the workflow neither downloads nor runs the PR's code
# (no checkout, no `run:`), and the script interpolates nothing from the event into a command: it reads
# the PR through the API, compares the comment with the exact phrase and writes to a branch of its own.
name: CLA

on:  # zizmor: ignore[dangerous-triggers] no checkout or execution of the PR's code (see above)
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # record the signature in the cla-signatures branch
      pull-requests: write   # read the PR's commits and comment
      statuses: write        # "CLA" status on the latest commit
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Tamandua CLA and I accept it' ||
         github.event.comment.body == 'He leído el CLA de Tamandua y lo acepto'))
    steps:
      - name: Check and record signatures
        # v9.0.0, pinned by commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const PHRASE = 'I have read the Tamandua CLA and I accept it'
            const PHRASES = [PHRASE, 'He leído el CLA de Tamandua y lo acepto']  // either language signs
            const BRANCH = 'cla-signatures'
            const FILE = 'signatures/v1/cla.json'
            const MARKER = '<!-- tamandua-cla -->'
            const DOCUMENT = 'https://github.com/Tamandua-AppSec/tamandua/blob/main/.github/CLA.md'
            const ALLOWLIST = new Set(['BrayansStivens'])
            const { owner, repo } = context.repo
            const number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number

            async function load() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH })
                const parsed = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'))
                return { sha: data.sha, list: Array.isArray(parsed.signedContributors) ? parsed.signedContributors : [] }
              } catch (error) {
                if (error.status === 404) return { sha: undefined, list: [] }
                throw error
              }
            }

            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: BRANCH })
              } catch (error) {
                if (error.status !== 404) throw error
                const { data: repository } = await github.rest.repos.get({ owner, repo })
                const { data: head } = await github.rest.git.getRef({ owner, repo, ref: `heads/${repository.default_branch}` })
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: head.object.sha })
              }
            }

            // Authors of the PR's commits with a GitHub account; bots and the allowlist don't sign.
            async function authors() {
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 })
              const people = new Map()
              const unknown = new Set()
              for (const commit of commits) {
                const who = commit.author
                if (who && who.id) {
                  if (who.type !== 'Bot' && !ALLOWLIST.has(who.login)) people.set(who.id, who.login)
                } else {
                  unknown.add((commit.commit.author && commit.commit.author.name) || 'no name')
                }
              }
              return { people, unknown }
            }

            async function sign(commenter) {
              for (let attempt = 0; attempt < 3; attempt++) {
                await ensureBranch()
                const { sha, list } = await load()
                if (list.some(entry => entry.id === commenter.id)) return
                list.push({ name: commenter.login, id: commenter.id, comment_id: context.payload.comment.id,
                            created_at: context.payload.comment.created_at, repoId: context.payload.repository.id,
                            pullRequestNo: number })
                const content = Buffer.from(JSON.stringify({ signedContributors: list }, null, 2) + '\n').toString('base64')
                try {
                  await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: FILE, branch: BRANCH, sha, content,
                    message: `CLA signed by ${commenter.login} in #${number}` })
                  return
                } catch (error) {
                  // Another signature landed at the same time: reload and retry.
                  if ((error.status !== 409 && error.status !== 422) || attempt === 2) throw error
                }
              }
            }

            async function report(pending, unknown, sha) {
              const ok = pending.length === 0 && unknown.size === 0
              await github.rest.repos.createCommitStatus({ owner, repo, sha, context: 'CLA', state: ok ? 'success' : 'failure',
                description: ok ? 'Everyone in this PR has signed the CLA' : 'CLA signature missing' })
              const body = ok
                ? `${MARKER}\nEveryone contributing to this PR has signed the CLA. Thank you.`
                : [MARKER,
                   `Thank you for your contribution. Before we can accept it, please read and accept the [Contributor License Agreement](${DOCUMENT}). ` +
                   'You keep the copyright in your code; the agreement gives us a license to also distribute it in a possible commercial edition, ' +
                   'and guarantees it stays available in the free edition.',
                   '', 'To sign it, comment exactly this phrase (you only need to do it once):', '', '```', PHRASE, '```',
                   ...(pending.length ? ['', `Signature still needed from: ${pending.map(login => '@' + login).join(', ')}.`] : []),
                   ...(unknown.size ? ['', `Some commits have no linked GitHub account (${[...unknown].join(', ')}): set your account's email ` +
                                       'in git, rewrite those commits and push them again.'] : [])].join('\n')
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 })
              const previous = comments.find(comment => comment.user && comment.user.type === 'Bot' && (comment.body || '').startsWith(MARKER))
              if (previous) {
                if (previous.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
              } else if (!ok) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body })
              }
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            const { people, unknown } = await authors()
            if (context.eventName === 'issue_comment' && PHRASES.includes(context.payload.comment.body.trim())) {
              const commenter = context.payload.comment.user
              // Only an author of one of the PR's commits can sign: nobody signs for someone else.
              if (people.has(commenter.id)) await sign(commenter)
            }
            const { list } = await load()
            const signed = new Set(list.map(entry => entry.id))
            const pending = [...people].filter(([id]) => !signed.has(id)).map(([, login]) => login)
            await report(pending, unknown, pull.head.sha)
