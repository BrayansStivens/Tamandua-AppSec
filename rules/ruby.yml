rules:
  - id: appsec.rb.sql-interpolation
    languages: [ruby]
    severity: ERROR
    message: "The SQL text uses string interpolation. Use parameterized conditions, such as where('col = ?', value), or hash conditions."
    metadata: {cwe: [89], owasp: "A05:2025", category: injection, confidence: HIGH,
      title: {en: "SQL query built with string interpolation", es: "Consulta SQL construida con interpolación"},
      fix: {en: "The SQL text uses string interpolation. Use parameterized conditions, such as where('col = ?', value), or hash conditions.",
            es: "SQL con interpolación de cadenas. Usa condiciones parametrizadas: where('col = ?', valor) o hashes."}}
    pattern-either:
      - pattern: $M.where("...#{$X}...", ...)
      - pattern: $M.find_by_sql("...#{$X}...", ...)
      - pattern: $M.order("...#{$X}...")
      - pattern: $M.group("...#{$X}...")
      - pattern: $C.execute("...#{$X}...", ...)
      - pattern: $M.joins("...#{$X}...")
      - pattern: $M.select("...#{$X}...")
  - id: appsec.rb.command-injection
    languages: [ruby]
    severity: ERROR
    message: "The command uses string interpolation. Pass the arguments separately: system('cmd', arg1, arg2)."
    metadata: {cwe: [78], owasp: "A05:2025", category: injection, confidence: HIGH,
      title: {en: "System command built with string interpolation", es: "Comando del sistema construido con interpolación"},
      fix: {en: "The command uses string interpolation. Pass the arguments separately: system('cmd', arg1, arg2).",
            es: "Comando del sistema con interpolación de cadenas. Usa la forma con argumentos separados: system('cmd', arg1, arg2)."}}
    pattern-either:
      - pattern: system("...#{$X}...")
      - pattern: exec("...#{$X}...")
      - pattern: IO.popen("...#{$X}...", ...)
      - pattern: Open3.capture3("...#{$X}...", ...)
      - pattern: Open3.capture2("...#{$X}...", ...)
      - pattern: Kernel.system("...#{$X}...")
      - pattern: "`...#{$X}...`"
  - id: appsec.rb.unsafe-deserialization
    languages: [ruby]
    severity: ERROR
    message: "Marshal.load and YAML.load build arbitrary objects: code execution on untrusted data. Use YAML.safe_load or JSON."
    metadata: {cwe: [502], owasp: "A08:2025", category: deserialization, confidence: MEDIUM,
      title: {en: "Unsafe deserialization (Marshal/YAML)", es: "Deserialización insegura (Marshal/YAML)"},
      fix: {en: "Marshal.load and YAML.load build arbitrary objects: code execution on untrusted data. Use YAML.safe_load or JSON.",
            es: "Marshal.load / YAML.load instancian objetos arbitrarios: ejecución de código con datos no confiables. Usa YAML.safe_load o JSON."}}
    pattern-either:
      - pattern: Marshal.load(...)
      - pattern: YAML.load(...)
      - pattern: YAML.unsafe_load(...)
      - pattern: Psych.load(...)
  - id: appsec.rb.html-safe-non-literal
    languages: [ruby]
    severity: WARNING
    message: "html_safe or raw on a dynamic value turns off Rails escaping and allows XSS if it holds external data. Use sanitize."
    metadata: {cwe: [79], owasp: "A05:2025", category: xss, confidence: MEDIUM,
      title: {en: "Unescaped HTML via html_safe/raw", es: "HTML sin escapar con html_safe/raw"},
      fix: {en: "html_safe or raw on a dynamic value turns off Rails escaping and allows XSS if it holds external data. Use sanitize.",
            es: "html_safe / raw sobre un valor dinámico desactiva el escape de Rails: XSS si contiene datos externos. Usa sanitize."}}
    patterns:
      - pattern-either:
          - pattern: $X.html_safe
          - pattern: raw($X)
      - pattern-not: |
          "...".html_safe
      - pattern-not: raw("...")
  - id: appsec.rb.mass-assignment-permit-all
    languages: [ruby]
    severity: WARNING
    message: "params.permit! accepts any attribute, so sensitive fields such as role or admin can be mass-assigned. Permit attributes explicitly."
    metadata: {cwe: [915], owasp: "A01:2025", category: mass-assignment, confidence: HIGH,
      title: {en: "Mass assignment with params.permit!", es: "Asignación masiva con params.permit!"},
      fix: {en: "params.permit! accepts any attribute, so sensitive fields such as role or admin can be mass-assigned. Permit attributes explicitly.",
            es: "params.permit! acepta cualquier atributo: asignación masiva de campos sensibles (rol, admin). Permite atributos explícitos."}}
    pattern: $P.permit!
  - id: appsec.rb.open-redirect
    languages: [ruby]
    severity: WARNING
    message: "redirect_to takes its target from params. Check it against allowed paths, or use only_path: true."
    metadata: {cwe: [601], owasp: "A01:2025", category: redirect, confidence: HIGH,
      title: {en: "Open redirect from request params", es: "Redirección abierta desde params"},
      fix: {en: "redirect_to takes its target from params. Check it against allowed paths, or use only_path: true.",
            es: "redirect_to con destino de params: redirección abierta. Valida contra rutas permitidas o usa only_path: true."}}
    pattern-either:
      - pattern: redirect_to params[$K]
      - pattern: redirect_to params[$K], ...
      - pattern: redirect_to params.fetch($K, ...)
