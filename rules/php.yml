rules:
  - id: appsec.php.sql-injection
    languages: [php]
    severity: ERROR
    message: "Entrada del usuario llega a una consulta SQL. Usa sentencias preparadas (PDO/mysqli) con parámetros vinculados."
    metadata: {cwe: [89], owasp: "A05:2025", category: injection, confidence: HIGH}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mysqli_query($C, $Q, ...)
              - pattern: mysql_query($Q, ...)
              - pattern: $C->query($Q, ...)
              - pattern: $C->exec($Q, ...)
              - pattern: pg_query($C, $Q, ...)
          - focus-metavariable: $Q
  - id: appsec.php.command-injection
    languages: [php]
    severity: ERROR
    message: "Entrada del usuario llega a la ejecución de un comando del sistema. Usa escapeshellarg sobre cada argumento y valida contra una lista permitida."
    metadata: {cwe: [78], owasp: "A05:2025", category: injection, confidence: HIGH, severity: CRITICAL}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: system($X, ...)
              - pattern: exec($X, ...)
              - pattern: shell_exec($X)
              - pattern: passthru($X, ...)
              - pattern: popen($X, ...)
              - pattern: proc_open($X, ...)
          - focus-metavariable: $X
  - id: appsec.php.eval-non-literal
    languages: [php]
    severity: ERROR
    message: "eval() sobre una expresión no literal ejecuta código arbitrario."
    metadata: {cwe: [95], owasp: "A05:2025", category: injection, confidence: MEDIUM, severity: CRITICAL}
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
  - id: appsec.php.unserialize-from-request
    languages: [php]
    severity: ERROR
    message: "unserialize sobre entrada del usuario: inyección de objetos y ejecución de código. Usa json_decode o allowed_classes => false."
    metadata: {cwe: [502], owasp: "A08:2025", category: deserialization, confidence: HIGH}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sinks:
      - patterns:
          - pattern: unserialize($X, ...)
          - focus-metavariable: $X
  - id: appsec.php.file-inclusion-from-request
    languages: [php]
    severity: ERROR
    message: "include/require con ruta tomada de la petición: inclusión de archivos locales o remotos con ejecución de código. Usa una lista fija de archivos permitidos."
    metadata: {cwe: [98], owasp: "A01:2025", category: injection, confidence: HIGH, severity: CRITICAL}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: include $X;
              - pattern: include_once $X;
              - pattern: require $X;
              - pattern: require_once $X;
          - focus-metavariable: $X
  - id: appsec.php.reflected-xss
    languages: [php]
    severity: WARNING
    message: "Entrada del usuario impresa sin escapar: XSS reflejado. Escapa con htmlspecialchars($x, ENT_QUOTES, 'UTF-8')."
    metadata: {cwe: [79], owasp: "A05:2025", category: xss, confidence: HIGH}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: (int) $X
      - pattern: intval(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: echo $X;
              - pattern: print $X;
              - pattern: printf($X, ...);
          - focus-metavariable: $X
