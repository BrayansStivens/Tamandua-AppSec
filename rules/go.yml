rules:
  - id: appsec.go.sql-string-building
    languages: [go]
    severity: ERROR
    message: "SQL construido con concatenación o fmt.Sprintf. Usa placeholders ($1 / ?) con los argumentos separados."
    metadata: {cwe: [89], owasp: "A05:2025", category: injection, confidence: HIGH}
    pattern-either:
      - pattern: $DB.Query("..." + $X, ...)
      - pattern: $DB.QueryRow("..." + $X, ...)
      - pattern: $DB.Exec("..." + $X, ...)
      - pattern: $DB.Query(fmt.Sprintf("...", ...), ...)
      - pattern: $DB.QueryRow(fmt.Sprintf("...", ...), ...)
      - pattern: $DB.Exec(fmt.Sprintf("...", ...), ...)
      - pattern: $DB.Raw("..." + $X, ...)
      - pattern: $DB.Raw(fmt.Sprintf("...", ...), ...)
  - id: appsec.go.shell-command-non-literal
    languages: [go]
    severity: ERROR
    message: "Comando pasado a un shell con contenido dinámico. Invoca el binario directamente con argumentos separados y valida la entrada."
    metadata: {cwe: [78], owasp: "A05:2025", category: injection, confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: exec.Command("sh", "-c", $X, ...)
          - pattern: exec.Command("bash", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "sh", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "bash", "-c", $X, ...)
      - pattern-not: exec.Command("sh", "-c", "...", ...)
      - pattern-not: exec.Command("bash", "-c", "...", ...)
  - id: appsec.go.tls-insecure-skip-verify
    languages: [go]
    severity: ERROR
    message: "InsecureSkipVerify desactiva la validación del certificado: el TLS deja de proteger. Configura RootCAs con la CA correcta."
    metadata: {cwe: [295], owasp: "A04:2025", category: crypto, confidence: HIGH}
    pattern: |
      tls.Config{..., InsecureSkipVerify: true, ...}
  - id: appsec.go.template-html-unescaped
    languages: [go]
    severity: WARNING
    message: "template.HTML sobre un valor dinámico desactiva el escape: XSS si contiene datos externos."
    metadata: {cwe: [79], owasp: "A05:2025", category: xss, confidence: MEDIUM}
    patterns:
      - pattern: template.HTML($X)
      - pattern-not: template.HTML("...")
  - id: appsec.go.path-traversal-from-request
    languages: [go]
    severity: ERROR
    message: "Ruta de archivo construida con entrada de la petición. Usa filepath.Base o comprueba que filepath.Clean quede dentro del directorio permitido."
    metadata: {cwe: [22], owasp: "A01:2025", category: path-traversal, confidence: HIGH}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: mux.Vars($R)
          - pattern: $C.Param(...)
          - pattern: $C.Query(...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.ReadFile($P)
              - pattern: ioutil.ReadFile($P)
              - pattern: os.Remove($P)
              - pattern: http.ServeFile($W, $R, $P)
          - focus-metavariable: $P
  - id: appsec.go.weak-hash
    languages: [go]
    severity: INFO
    message: "MD5/SHA-1 no sirven para contraseñas ni firmas. Para contraseñas usa bcrypt/argon2; para integridad, SHA-256."
    metadata: {cwe: [328], owasp: "A04:2025", category: crypto, confidence: LOW}
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
