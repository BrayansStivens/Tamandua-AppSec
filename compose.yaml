# Tamandua autoalojado. La forma recomendada de usarlo es el Makefile:
#
#   make up          # prepara .env, construye, arranca y muestra el código de configuración
#   make help        # el resto de comandos
#
# Sin make:  cp .env.example .env && mkdir -p data config && docker compose up --build -d
#
# Servicios: `api` (el panel y la API, sin Docker), `worker` (ejecuta los análisis y las tareas periódicas),
# `postgres` (datos) y `opengrep` (solo construye la imagen del motor).
#
# Los motores de análisis (Trivy, Gitleaks, Opengrep) son contenedores hermanos que el WORKER lanza por el socket
# de Docker: por eso solo él lo monta, y por eso la carpeta de datos se comparte con la MISMA ruta absoluta del host
# (TAMANDUA_HOST_DATA_DIR). El socket de Docker equivale a root en el host: el servicio que atiende peticiones
# (api) ya no lo tiene.
# Nombre fijo del proyecto: el volumen y la red no dependen de cómo se llame la carpeta clonada.
name: tamandua

# Lo común al API y al worker (misma imagen, mismos datos y endurecimiento).
x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      VERSION: ${TAMANDUA_VERSION:-0.9}
  image: tamandua/app:${TAMANDUA_VERSION:-0.9}
  init: true
  # Tu UID/GID para que los ficheros de ./data y ./config sean tuyos (ver .env.example).
  user: "${TAMANDUA_UID:-10001}:${TAMANDUA_GID:-10001}"
  env_file:
    - path: .env
      required: false
  # Endurecimiento: sistema de ficheros de solo lectura (solo se escribe en /data, /config y
  # temporales en memoria), sin capacidades de Linux y sin escalada de privilegios.
  read_only: true
  tmpfs:
    - /tmp:size=256m
    - /home/tamandua:size=16m,uid=${TAMANDUA_UID:-10001},gid=${TAMANDUA_GID:-10001}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  restart: unless-stopped

x-app-env: &app-env
  TAMANDUA_DATA_DIR: /data
  TAMANDUA_HOST_DATA_DIR: ${PWD}/data
  TAMANDUA_HOST_RULES_DIR: ${PWD}/rules
  TAMANDUA_CONFIG_DIR: /config
  TAMANDUA_PUBLIC_URL: ${TAMANDUA_PUBLIC_URL:-http://127.0.0.1:8766}
  TAMANDUA_ALLOWED_ORIGINS: ${TAMANDUA_ALLOWED_ORIGINS:-http://127.0.0.1:8766,http://localhost:8766}
  TAMANDUA_LOG_LEVEL: ${TAMANDUA_LOG_LEVEL:-INFO}
  # admins (por defecto): TOTP obligatorio para administradores · all: para todos · none: opcional
  TAMANDUA_REQUIRE_TOTP: ${TAMANDUA_REQUIRE_TOTP:-admins}
  TAMANDUA_PR_POLL_SECONDS: ${TAMANDUA_PR_POLL_SECONDS:-300}
  TAMANDUA_BRANCH_MIN_MINUTES: ${TAMANDUA_BRANCH_MIN_MINUTES:-60}
  TAMANDUA_ADVISORY_WATCH_HOURS: ${TAMANDUA_ADVISORY_WATCH_HOURS:-24}
  # Ejecuciones, hallazgos y triage viven en PostgreSQL (servicio `postgres`, solo en la red interna).
  TAMANDUA_DATABASE_URL: "postgresql+psycopg://tamandua:${TAMANDUA_DB_PASSWORD:?Falta TAMANDUA_DB_PASSWORD en .env (ejecuta make setup)}@postgres:5432/tamandua"
  HOME: /home/tamandua

x-app-volumes: &app-volumes
  - ./data:/data
  - ./rules:/app/rules:ro
  # Secretos cifrados (GitHub App, claves de IA, Jira) y su clave maestra. Nunca en ./data.
  - ${TAMANDUA_HOST_CONFIG_DIR:-./config}:/config

services:
  api:
    <<: *app
    container_name: tamandua
    ports:
      # Solo en esta máquina por defecto. Para exponerlo en la red usa HTTPS (ver README).
      - "${TAMANDUA_HOST_BIND:-127.0.0.1}:${TAMANDUA_HOST_PORT:-8766}:8766"
    environment:
      <<: *app-env
      # Los análisis los ejecuta el servicio `worker`: el API no necesita Docker.
      TAMANDUA_EMBEDDED_WORKER: "0"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8766/api/health', headers={'Host':'127.0.0.1:8766'}), timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ejecuta los análisis de la cola (en PostgreSQL) y las tareas periódicas. Es el único con el socket de Docker.
  # Se puede escalar (docker compose up -d --scale worker=2): las tareas periódicas solo las corre uno.
  worker:
    <<: *app
    command: ["python", "-m", "tamandua", "--data-dir", "/data", "worker"]
    # Sin HTTP: la salud es su latido en la base (el de la imagen consulta /api/health, que aquí no existe).
    healthcheck:
      test: ["CMD", "python", "-m", "tamandua", "--data-dir", "/data", "worker", "--check"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    environment: *app-env
    volumes:
      - ./data:/data
      - ./rules:/app/rules:ro
      - ${TAMANDUA_HOST_CONFIG_DIR:-./config}:/config
      - /var/run/docker.sock:/var/run/docker.sock
    # Acceso al socket de Docker para lanzar los motores. En Docker Desktop y OrbStack (macOS,
    # Windows) el socket es del grupo 0; en Linux y en WSL con Docker nativo, del grupo `docker`,
    # cuyo número varía: `make` lo detecta y lo pasa en DOCKER_SOCKET_GID. Si no hay otro grupo
    # que añadir, la segunda entrada repite tu propio grupo (compose no admite dos iguales).
    group_add:
      - "0"
      - "${DOCKER_SOCKET_GID:-${TAMANDUA_GID:-10001}}"
    depends_on:
      opengrep:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Base de datos. Sin puerto publicado: solo la app la alcanza, por la red interna de compose. Los datos, en el
  # volumen `tamandua-pg` (make backup hace además un pg_dump).
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: tamandua-postgres
    environment:
      POSTGRES_USER: tamandua
      POSTGRES_DB: tamandua
      POSTGRES_PASSWORD: "${TAMANDUA_DB_PASSWORD:?Falta TAMANDUA_DB_PASSWORD en .env (ejecuta make setup)}"
    volumes:
      - tamandua-pg:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamandua -d tamandua"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Solo construye la imagen del motor SAST (con su binario verificado por SHA-256) y comprueba
  # que arranca; la app la lanza después por cada análisis. Termina al momento: es normal.
  opengrep:
    build: docker/engines/opengrep
    image: tamandua/opengrep:1.30.0
    command: ["--version"]
    network_mode: none
    restart: "no"

volumes:
  tamandua-pg:
